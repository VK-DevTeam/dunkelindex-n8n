services:
  - type: web
    name: n8n
    env: node
    plan: starter
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    envVars:
      - key: N8N_HOST
        value: 0.0.0.0
      - key: N8N_PORT
        value: 10000
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        value: https://n8n.dunkelindex.com
      - key: N8N_EDITOR_BASE_URL
        value: https://n8n.dunkelindex.com
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "false"
